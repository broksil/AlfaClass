<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>ألفاكلاس — تسجيل الدخول</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../icon-192.png">
  <style>
    :root {
      --bg-primary: #080818;
      --accent: #7c3aed;
      --accent2: #a78bfa;
      --accent-glow: rgba(124,58,237,0.3);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg-primary);
      color: #f0f0ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
    }
    #loading-screen {
      position: fixed;
      inset: 0;
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      gap: 20px;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    #loading-screen.hide { opacity: 0; transform: scale(1.05); pointer-events: none; }
    .loading-verse {
      font-size: 26px; font-weight: 800; letter-spacing: 0;
      background: linear-gradient(135deg, #fff 30%, var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      padding: 0 20px;
    }
    .loading-bar {
      width: 220px; height: 6px;
      background: rgba(0,0,0,0.4);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
      position: relative;
    }
    .loading-bar-inner {
      position: absolute; top: 0; right: 0; bottom: 0; width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      box-shadow: 0 0 15px var(--accent-glow);
      transition: width 0.3s ease;
    }
    .loading-error {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      max-width: 600px;
      margin: 0 auto;
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.4);
      border-radius: 12px;
      padding: 16px;
      color: #ff8f8f;
      font-size: 13px;
      font-family: monospace;
      text-align: left;
      direction: ltr;
      z-index: 10000;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .loading-error.visible { display: block; }
  </style>
  <!-- Telegram WebApp SDK — MUST be loaded before custom script -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="loading-screen">
    <div class="loading-verse">وقل ربي زدني علماً</div>
    <div class="loading-bar"><div class="loading-bar-inner" id="progress-fill"></div></div>
  </div>

  <div id="loading-error" class="loading-error"></div>

  <script src="../utils/username-utils.js"></script>
  <script src="../profile/telegram-auth.js"></script>
</body>
</html>
