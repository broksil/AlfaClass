<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>الملف الشخصي — ألفاكلاس</title>
<link rel="icon" type="image/png" sizes="32x32" href="../icon-192.png">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#080818; color:#f0f0ff; text-align:center; padding:24px;
         font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif; }
  .card { max-width:420px; }
  .logo { font-size:46px; margin-bottom:8px; }
  h1 { font-size:20px; margin:0 0 8px; font-weight:700; }
  p { color:#a9a9c9; font-size:14.5px; line-height:1.7; margin:0 0 18px; }
  .btn { display:inline-block; padding:12px 22px; border-radius:12px; background:#5b6cff;
         color:#fff; text-decoration:none; font-size:15px; }
  .err { display:none; color:#ff8f8f; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🎓</div>
    <h1>ألفاكلاس</h1>
    <p id="status">جارٍ فتح الملف الشخصي…</p>
    <p class="err" id="err">رابط غير صالح — لا يوجد معرّف حساب في الرابط.</p>
    <a class="btn" href="../">العودة إلى ألفاكلاس</a>
  </div>

  <script>
    /* ═══════════════════════════════════════════════════════════════
       استخراج معرّف الطالب من الرابط النظيف:  /AlfaClass/profile?u=<USER_ID>
       ── URLSearchParams تقرأ معلمة u وتفكّ ترميزها تلقائياً ──
       النتيجة تُخزَّن في profileUid وتُستخدم:
         1) حالياً: تمريرها للتطبيق الرئيسي الذي يفتح الملف فوراً.
         2) لاحقاً (صفحة مستقلة): جلب بيانات الطالب من Firestore، مثلاً:
              import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js';
              const snap = await getDoc(doc(db, 'users', profileUid));
              if (snap.exists()) renderProfile(snap.data());
       ═══════════════════════════════════════════════════════════════ */
    const params = new URLSearchParams(window.location.search);
    const profileUid = (params.get('u') || '').trim();

    if (!profileUid || profileUid.length > 120 || /[/?#\s]/.test(profileUid)) {
      // معلمة مفقودة أو معرّف مشبوه — رسالة خطأ بدل التحويل
      document.getElementById('status').style.display = 'none';
      document.getElementById('err').style.display = 'block';
    } else {
      /* ── مؤقتاً: التطبيق الرئيسي هو العارض الوحيد للملفات الشخصية،
              فنُمرّر المعلمة u إليه ويفتح الملف تلقائياً (نفس مسار رابط الجذر ?u=).
              عند بناء صفحة مستقلة لاحقاً: أوقف هذا التوجيه واستخدم Firestore أعلاه. ── */
      window.location.replace('../?u=' + encodeURIComponent(profileUid));
    }
  </script>
</body>
</html>
